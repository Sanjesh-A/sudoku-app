# Application
spring.application.name=sudoku-api
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/sudoku
spring.datasource.username=sudoku
spring.datasource.password=sudoku_dev

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Auth0
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-werz3nwy4h7wd62i.us.auth0.com/
auth0.audience=https://api.sudoku-app.com